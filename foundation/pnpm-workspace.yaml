# One copy of the analytics client, not two. `@hanzo/gui` and `@hanzo/ui` pin
# `@hanzogui/telemetry` to an exact version, and each pin drags its own
# `@hanzo/event`, so a bundle can carry two org key tables and which one a beacon
# uses depends on which module the import graph reached first. The key belongs to
# the domain; there is one right answer per domain, so there is one copy here.
#
# That copy has to be a version whose table names projects that exist. 0.3.39 and
# 0.3.40 name three that do not: all three keys answer `403 ingest_key_unknown`
# against /v1/event, so this site reported nothing at all while looking healthy.
# 0.3.41 carries the same values as universe's SPA_INGEST_KEYRING, checked one by
# one against the endpoint.
overrides:
  '@hanzo/event': '0.3.41'
  '@hanzo/observe': '0.1.11'
  '@hanzogui/telemetry': '8.3.3'
